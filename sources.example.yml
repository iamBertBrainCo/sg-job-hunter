  - { name: Stripe, url: "https://job-boards.greenhouse.io/stripe", enabled: true }
  - { name: Coinbase, url: "https://job-boards.greenhouse.io/coinbase", enabled: true }
  - { name: Databricks, url: "https://job-boards.greenhouse.io/databricks", enabled: true }
  - { name: Datadog, url: "https://job-boards.greenhouse.io/datadog", enabled: true }
  - { name: ServiceNow, url: "https://careers.smartrecruiters.com/ServiceNow", enabled: true }
  - { name: MongoDB, url: "https://job-boards.greenhouse.io/mongodb", enabled: true }
  - { name: Thunes, url: "https://job-boards.greenhouse.io/thunes", enabled: true }
  - { name: GitLab, url: "https://job-boards.greenhouse.io/gitlab", enabled: true }
