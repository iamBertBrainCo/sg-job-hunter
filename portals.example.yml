# Portal scanner configuration for `npm run scan` (the advanced scanner).
#
# For the guided flow you do not need this file: `npm run find-jobs` uses
# sources.yml instead. Use this when you want the full scanner with
# de-duplication history, title filters and data/pipeline.md.
#
#   1. Copy this file to portals.yml
#   2. Put your target role words under title_filter.positive and in the
#      keywords / searchKeywords of each job board
#   3. Switch sources on or off with enabled: true / false

title_filter:
  # A job is kept when its title contains one of these (case-insensitive).
  positive:
    - "HR Business Partner"
    - "Human Resources"
  negative:
    - "Intern"
    - "Internship"
    - "Part-time"

# Keep only postings whose location mentions one of these.
location_filter:
  allow:
    - Singapore

job_boards:
  - name: MyCareersFuture
    provider: mycareersfuture
    mycareersfuture:
      # Leave out to use target_roles from config/profile.yml.
      keywords: ["HR business partner"]
    max_pages: 2
    enabled: true
    notes: "Singapore's national job bank (WSG). Public API, no login."

  - name: JobStreet Singapore
    provider: jobstreet
    api: https://sg.jobstreet.com/api/jobsearch/v5/search
    siteKey: SG-Main
    searchKeywords: "HR business partner"
    max_pages: 3
    enabled: true

  # ASEAN boards: switch on, and add the country to location_filter.allow
  - name: JobStreet Malaysia
    provider: jobstreet
    api: https://my.jobstreet.com/api/jobsearch/v5/search
    siteKey: MY-Main
    searchKeywords: "HR business partner"
    max_pages: 2
    enabled: false

  - name: JobStreet Indonesia
    provider: jobstreet
    api: https://id.jobstreet.com/api/jobsearch/v5/search
    siteKey: ID-Main
    searchKeywords: "HR business partner"
    max_pages: 2
    enabled: false

  - name: JobStreet Philippines
    provider: jobstreet
    api: https://ph.jobstreet.com/api/jobsearch/v5/search
    siteKey: PH-Main
    searchKeywords: "HR business partner"
    max_pages: 2
    enabled: false

  - name: JobsDB Thailand
    provider: jobstreet
    api: https://th.jobsdb.com/api/jobsearch/v5/search
    siteKey: TH-Main
    searchKeywords: "HR business partner"
    max_pages: 2
    enabled: false

  - name: Kalibrr
    provider: kalibrr
    api: https://www.kalibrr.com/kjs/job_board/search
    searchKeywords: "HR"
    max_pages: 2
    enabled: false
    notes: "Philippines and Indonesia."

  - name: Tech in Asia
    provider: techinasia
    max_pages: 2
    enabled: false
    notes: "Southeast Asian startups."

# Employer career pages with Singapore or ASEAN openings (checked November 2026).
tracked_companies:
